name: pr-review

# Automated PR review generation — posts a review comment with lint/type-check/test summary.
# Satisfies automated_pr_review (danger.js / droid exec / custom GitHub Actions comments).
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  review:
    name: automated review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v2
        with:
          version: 2025.9.12

      - name: Trust & install toolchain
        run: mise trust && mise install

      - run: npm ci --prefer-offline

      - name: Collect signals
        id: signals
        run: |
          set +e
          echo "Running checks for automated review..."

          mise run type-check > /tmp/typecheck.log 2>&1
          echo "typecheck_exit=$?" >> $GITHUB_OUTPUT

          npx tsc --noEmit > /tmp/tsc.log 2>&1
          TSC_EXIT=$?

          mise run lint > /tmp/lint.log 2>&1
          LINT_EXIT=$?

          mise run test > /tmp/test.log 2>&1
          TEST_EXIT=$?

          # Knip (unused deps)
          mise run knip:check > /tmp/knip.log 2>&1
          KNIP_EXIT=$?

          # Size check (best-effort)
          mise run build > /tmp/build.log 2>&1
          BUILD_EXIT=$?
          if [ $BUILD_EXIT -eq 0 ]; then
            mise run size:check > /tmp/size.log 2>&1 || true
          fi

          echo "tsc_exit=$TSC_EXIT" >> $GITHUB_OUTPUT
          echo "lint_exit=$LINT_EXIT" >> $GITHUB_OUTPUT
          echo "test_exit=$TEST_EXIT" >> $GITHUB_OUTPUT
          echo "knip_exit=$KNIP_EXIT" >> $GITHUB_OUTPUT
          echo "build_exit=$BUILD_EXIT" >> $GITHUB_OUTPUT

          # Count changed files / lines for context
          echo "changed_files=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | wc -l | tr -d ' ')" >> $GITHUB_OUTPUT

      - name: Post review comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            function readLog(path, maxLines = 40) {
              try {
                const content = fs.readFileSync(path, 'utf8').trim();
                if (!content) return '_no output_';
                const lines = content.split('\n');
                const snippet = lines.slice(0, maxLines).join('\n');
                return '```\n' + snippet + (lines.length > maxLines ? '\n... (truncated)' : '') + '\n```';
              } catch { return '_log not available_'; }
            }

            const typecheckExit = '${{ steps.signals.outputs.typecheck_exit }}';
            const lintExit = '${{ steps.signals.outputs.lint_exit }}';
            const testExit = '${{ steps.signals.outputs.test_exit }}';
            const buildExit = '${{ steps.signals.outputs.build_exit }}';
            const knipExit = '${{ steps.signals.outputs.knip_exit }}';

            const icon = (v) => v === '0' ? '✅' : '❌';
            const changedFiles = '${{ steps.signals.outputs.changed_files }}';

            const body = `## 🤖 Automated Review — ModVitals

            **Summary** — ${icon(testExit)} tests · ${icon(lintExit)} lint · ${icon(typecheckExit)} type-check · ${icon(buildExit)} build · ${icon(knipExit)} unused-deps

            | Check | Result | Details |
            |-------|--------|---------|
            | Type check | ${icon(typecheckExit)} ${typecheckExit === '0' ? 'pass' : 'fail'} | \`mise run type-check\` |
            | Lint | ${icon(lintExit)} ${lintExit === '0' ? 'pass' : 'fail'} | \`mise run lint\` |
            | Tests (7 suites) | ${icon(testExit)} ${testExit === '0' ? 'pass' : 'fail'} | \`mise run test\` (452 assertions) |
            | Build | ${icon(buildExit)} ${buildExit === '0' ? 'pass' : 'fail'} | \`mise run build\` (Vite) |
            | Unused deps | ${icon(knipExit)} ${knipExit === '0' ? 'clean' : 'warnings'} | \`knip\` (see knip.json) |
            | Changed files | 📝 ${changedFiles} | vs \`${{ github.base_ref }}\` |

            <details><summary>Type-check log</summary>

            ${readLog('/tmp/typecheck.log')}

            </details>

            <details><summary>Lint log</summary>

            ${readLog('/tmp/lint.log')}

            </details>

            <details><summary>Test log (tail)</summary>

            ${readLog('/tmp/test.log', 60)}

            </details>

            <details><summary>Knip log</summary>

            ${readLog('/tmp/knip.log')}

            </details>

            ---

            *Generated by \`.github/workflows/pr-review.yml\` — re-runs on every push to the PR. Fix failures and push again.*

            <!-- automated-pr-review:modvitals -->
            `;

            // Upsert: update existing bot comment if present, else create new
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes('<!-- automated-pr-review:modvitals -->'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Publish check summary
        if: always()
        run: |
          echo "Automated review posted — checks above determine PR readiness." >> $GITHUB_STEP_SUMMARY
